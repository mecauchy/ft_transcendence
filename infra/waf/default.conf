# Default configuration for ft_transcendence WAF

# --- UPSTREAMS --- (define microservice here)
upstream front_upstream {
    server front:3005;
}

upstream gateway_upstream {
    server api-gateway:3000;
}

# --- HTTP SERVER ---
server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# --- HTTPS SERVER ---
server {
    listen 443 ssl;
    server_name _;

    # SSL configuration (self-signed for demo purposes)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Enforce HSTS and security headers
    # Note: avoid `includeSubDomains` and `preload` in local/dev to prevent browsers forcing HTTPS on other ports (like localhost:3005).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self' https: wss:;" always;

    client_max_body_size 50M;

    # Route api traffic to API Gateway
    location /api/ {
        proxy_pass http://gateway_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
   }

    # Route uploads (avatars, etc) to API Gateway
    location /uploads/ {
        proxy_pass http://gateway_upstream/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route everything else to Frontend
    location / {
        # Quick server-level protection for common SQLi patterns in query string
        if ($args ~* "(?i)(union.*select|sleep\(|;--|or.*1.*=.*1)") {
            return 403;
       }

        proxy_pass http://front_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
   }
}
