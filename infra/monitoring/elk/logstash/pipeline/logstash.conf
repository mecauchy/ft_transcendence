# Logstash Pipeline Configuration for ft_transcendence
# Receives logs from Filebeat and processes them before sending to Elasticsearch

input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Parse Docker container logs
  if [container][name] {
    # Add service name from container name
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Parse JSON logs if the message is JSON
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
      skip_on_invalid_json => true
    }
  }

  # Extract log level from common patterns
  if [message] =~ /\[(INFO|WARN|ERROR|DEBUG|FATAL)\]/ {
    grok {
      match => { "message" => "\[%{WORD:log_level}\]" }
      overwrite => [ "log_level" ]
    }
  }

  # Parse Fastify/Pino logs (JSON format)
  if [parsed_json][level] {
    mutate {
      add_field => { "log_level" => "%{[parsed_json][level]}" }
    }
  }

  # Add timestamp processing
  date {
    match => [ "[parsed_json][time]", "ISO8601", "UNIX_MS" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-%{+YYYY.MM.dd}"
  }

  # Debug output (optional - comment out in production)
  # stdout { codec => rubydebug }
}
