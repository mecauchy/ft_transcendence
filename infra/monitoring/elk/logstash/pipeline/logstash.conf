# ======================== Logstash Pipeline ==================================
# Pipeline for ft_transcendence - Receives logs from Filebeat, processes, sends to ES
# =============================================================================

# ================================== Input ====================================

input {
  # Receive logs from Filebeat
  beats {
    port => 5044
    host => "0.0.0.0"
    ssl_enabled => false
  }
  
  # Also accept TCP input for direct logging from applications
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp_input"]
  }
}

# ================================== Filter ===================================

filter {
  # Parse Docker container metadata
  if [container][name] {
    mutate {
      add_field => { "[@metadata][service]" => "%{[container][name]}" }
    }
  }

  # =================== Service-specific parsing ===================
  
  # WAF/Nginx access logs
  if [container][name] =~ /waf/ or [container][name] =~ /nginx/ {
    grok {
      match => { 
        "message" => [
          # Combined log format
          "%{IPORHOST:client_ip} - %{DATA:user} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code} %{NUMBER:bytes} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"",
          # Error log format
          "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:error_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_nginx"]
    }
    
    if [status_code] {
      mutate {
        convert => { "status_code" => "integer" }
        convert => { "bytes" => "integer" }
      }
    }
    
    mutate {
      add_tag => ["waf", "nginx", "proxy"]
    }
  }
  
  # API Gateway / Node.js logs
  if [container][name] =~ /api-gateway/ or [container][name] =~ /auth/ {
    # Try to parse JSON logs from Node.js
    json {
      source => "message"
      target => "nodejs"
      skip_on_invalid_json => true
    }
    
    # Parse common Node.js log patterns
    grok {
      match => {
        "message" => [
          "\[%{TIMESTAMP_ISO8601:timestamp}\] %{LOGLEVEL:level}: %{GREEDYDATA:log_message}",
          "%{LOGLEVEL:level}: %{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_nodejs"]
    }
    
    mutate {
      add_tag => ["nodejs", "backend"]
    }
  }
  
  # Frontend (Vite) logs
  if [container][name] =~ /front/ {
    grok {
      match => {
        "message" => [
          "%{TIME:timestamp} \[%{WORD:level}\] %{GREEDYDATA:log_message}",
          "vite v%{DATA:vite_version} %{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_vite"]
    }
    
    mutate {
      add_tag => ["vite", "frontend"]
    }
  }
  
  # PostgreSQL logs
  if [container][name] =~ /postgres/ {
    grok {
      match => {
        "message" => [
          "%{TIMESTAMP_ISO8601:timestamp} %{WORD:timezone} \[%{NUMBER:pid}\] %{WORD:level}:  %{GREEDYDATA:log_message}",
          "%{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_postgres"]
    }
    
    mutate {
      add_tag => ["postgres", "database"]
    }
  }
  
  # Redis logs
  if [container][name] =~ /redis/ {
    grok {
      match => {
        "message" => [
          "%{NUMBER:pid}:%{WORD:role} %{MONTHDAY} %{MONTH} %{YEAR} %{TIME} %{NOTSPACE:level} %{GREEDYDATA:log_message}"
        ]
      }
      tag_on_failure => ["_grokparsefailure_redis"]
    }
    
    mutate {
      add_tag => ["redis", "database"]
    }
  }
  
  # Vault logs
  if [container][name] =~ /vault/ {
    json {
      source => "message"
      target => "vault"
      skip_on_invalid_json => true
    }
    
    mutate {
      add_tag => ["vault", "security"]
    }
  }
  
  # =================== Common processing ===================
  
  # Normalize log levels
  if [level] {
    mutate {
      lowercase => [ "level" ]
    }
    
    # Map to standard levels
    translate {
      source => "level"
      target => "log_level"
      dictionary => {
        "trace" => "debug"
        "debug" => "debug"
        "info" => "info"
        "notice" => "info"
        "warn" => "warning"
        "warning" => "warning"
        "error" => "error"
        "err" => "error"
        "crit" => "critical"
        "critical" => "critical"
        "fatal" => "critical"
        "emerg" => "critical"
      }
      fallback => "info"
    }
  }
  
  # GeoIP for client IPs (if present)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => ["agent", "ecs", "host", "input", "log"]
  }
}

# ================================== Output ===================================

output {
  # Primary output: Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Authentication disabled in dev mode
    # user => "${LOGSTASH_ELASTICSEARCH_USER:elastic}"
    # password => "${LOGSTASH_ELASTICSEARCH_PASSWORD}"
    
    # Index by service type for easier querying
    index => "logs-%{[service][type]:unknown}-%{+YYYY.MM.dd}"
    
    # Template settings
    manage_template => true
    template_name => "logstash"
    template_overwrite => true
  }
  
  # Debug output (uncomment for troubleshooting)
  # stdout {
  #   codec => rubydebug
  # }
}
