# ======================== Filebeat Configuration =============================
# Filebeat for ft_transcendence - Collects Docker container logs
# Compatible VM (Docker root) ET Local (Docker rootless)
# =============================================================================

# ================================== Inputs ===================================

filebeat.inputs:

# --------------- Docker Container Logs (stdout/stderr) -----------------------
- type: log
  enabled: true
  paths:
    # Docker logs - Multiple paths for VM and local compatibility
    # VM path (Docker root mode): /var/lib/docker/containers/
    - /var/lib/docker/containers/*/*.log
    # Local path (42 school goinfre - Docker rootless): /goinfre/*/docker/containers/
    - /goinfre/*/docker/containers/*/*.log
    # Alternative rootless path: ~/.local/share/docker/containers/
    - /home/*/docker/containers/*/*.log
  
  # Parse JSON manually in processors (avoid json.keys_under_root due to malformed logs)
  encoding: utf-8
  
  # Keep files open to tail new logs continuously
  close_eof: false
  close_inactive: 5m
  scan_frequency: 10s
  
  # Multiline support for stack traces (Node.js, Python, Java)
  multiline.type: pattern
  multiline.pattern: '^\s+|^Traceback|^\t|^    at |^Caused by:|^\s*at '
  multiline.negate: false
  multiline.match: after
  multiline.max_lines: 100

# ================================ Processors =================================

processors:
  # Parse Docker JSON log format manually
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
      max_depth: 3
  
  # Extract container ID from log file path using Dissect (safer than JavaScript)
  - dissect:
      tokenizer: "%{?prefix}/containers/%{container.id}/[^/]*log"
      field: "log.file.path"
      ignore_missing: true
  
  # Fetch container metadata from Docker API (works in VM, may fail in rootless)
  - add_docker_metadata:
      host: "unix://${DOCKER_SOCKET_PATH:-/var/run/docker.sock}"
      match_source_index: 4
      match_short_id: false
  
  # Add host metadata
  - add_host_metadata:
      when.not.contains.tags: forwarded

  # Parse timestamp from Docker logs
  - timestamp:
      field: time
      layouts:
        - '2006-01-02T15:04:05.999999999Z07:00'
      test:
        - '2024-01-01T12:00:00.000000000Z'
      ignore_missing: true
      ignore_failure: true

  # Drop empty or health check logs (reduce noise)
  - drop_event:
      when:
        or:
          - equals:
              message: ""
          - contains:
              message: "health"
          - contains:
              message: "/health"

# ================================== Output ===================================

# Option 1: Direct to Elasticsearch (simpler, recommended for dev)
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # Authentication disabled in dev mode
  # username: "elastic"
  # password: "${ELASTICSEARCH_PASSWORD}"
  
  # Index naming
  index: "filebeat-%{[agent.version]}-%{+yyyy.MM.dd}"
  
  # Bulk settings for performance
  bulk_max_size: 1000
  worker: 1

# Option 2: Via Logstash (uncomment to use instead)
# output.logstash:
#   hosts: ["logstash:5044"]
#   loadbalance: true

# ================================= Template ==================================

setup.template.name: "filebeat"
setup.template.pattern: "filebeat-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

# Disable ILM for simpler setup
setup.ilm.enabled: false

# ================================= Logging ===================================

logging.level: info
logging.to_stderr: true
logging.metrics.enabled: true
logging.metrics.period: 30s

# ================================= Monitoring ================================

# Disable self-monitoring to reduce overhead
monitoring.enabled: false
