<!DOCTYPE html>
<html>
<head>
    <title>Grafana Auto-Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
       }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
       }
        h1 {
            color: #333;
            margin-top: 0;
       }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
       }
        @keyframes spin {
            0% {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
       }
        .status {
            color: #666;
            margin-top: 1rem;
       }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
       }
        .success {
            color: #388e3c;
            background: #e8f5e9;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
       }
        .info {
            color: #1976d2;
            background: #e3f2fd;
            padding: 1rem;
            border-radius: 4px;
            margin-top: 1rem;
            font-size: 0.9rem;
       }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Grafana</h1>
        <div class="spinner"></div>
        <div class="status" id="status">Initializing...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="info" class="info" style="display: none;"></div>
    </div>

    <script>
        // Configuration
        const GRAFANA_URL = 'http://localhost:3002';
        const VAULT_URL = 'http://localhost:8200';
        const USERNAME = 'grafana_admin';
        const VAULT_TOKEN = prompt("Enter Vault Token for Grafana Auto-Login:");

        async function checkCurrentUser() {
            try {
                const response = await fetch(`${GRAFANA_URL}/api/user/`, {
                    credentials: 'include'
               });
                
                if (response.ok) {
                    const user = await response.json();
                    return user;
               }
                return null;
           } catch (error) {
                console.error('Error checking user:', error);
                return null;
           }
       }

        async function getPasswordFromVault() {
            try {
                const response = await fetch(`${VAULT_URL}/v1/secret/data/grafana`, {
                    headers: {
                        'X-Vault-Token': VAULT_TOKEN
                   }
               });
                
                if (!response.ok) throw new Error(`Vault error:		${response.status}`);
                const data = await response.json();
                return data.data.data.password;
           } catch (error) {
                console.error('Error fetching from Vault:', error);
                return null;
           }
       }

        async function loginToGrafana(username, password) {
            try {
                const response = await fetch(`${GRAFANA_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                   },
                    body: JSON.stringify({
                        user: username,
                        password: password
                   }),
                    credentials: 'include'
               });

                if (!response.ok) {
                    throw new Error(`Login failed: ${response.status}`);
               }

                const data = await response.json();
                return data;
           } catch (error) {
                console.error('Error logging in:', error);
                return null;
           }
       }

        async function main() {
            try {
                const statusEl = document.getElementById('status');
                const errorEl = document.getElementById('error');
                const infoEl = document.getElementById('info');

                // Step 1: Check if user is already logged in
                statusEl.textContent = 'Checking session...';
                const currentUser = await checkCurrentUser();
                
                if (currentUser && currentUser.id) {
                    // User is already logged in
                    if (currentUser.isGrafanaAdmin || currentUser.login === USERNAME) {
                        statusEl.innerHTML = '<div class="success">✓ Admin logged in</div><p>Redirecting to dashboard...</p>';
                        setTimeout(() => {
                            window.location.href = `${GRAFANA_URL}/d/home`;
                       }, 1500);
                        return;
                   }
               }

                // Step 2: Try to get password and login
                statusEl.textContent = 'Attempting secure authentication...';
                
                let password = null;
                try {
                    password = await getPasswordFromVault();
               } catch (e) {
                    // Vault might not be accessible from browser (CORS)
                    console.warn('Could not reach Vault from browser (expected for CORS)');
               }

                if (password) {
                    statusEl.textContent = 'Authenticating with Grafana...';
                    const result = await loginToGrafana(USERNAME, password);
                    
                    if (result && result.id) {
                        statusEl.innerHTML = '<div class="success">✓ Admin authenticated!</div><p>Redirecting to dashboard...</p>';
                        setTimeout(() => {
                            window.location.href = `${GRAFANA_URL}/d/home`;
                       }, 1500);
                        return;
                   }
               }

                // Step 3: If we can't auto-login, redirect to login page with instructions
                statusEl.innerHTML = '<div class="info"><strong>ℹ️ Manual Login Required</strong><br>Please log in with your credentials.<br><br><strong>Username:</strong> grafana_admin<br><strong>Password:</strong> [stored in Vault]</div><p>Redirecting to login page...</p>';
                
                setTimeout(() => {
                    window.location.href = `${GRAFANA_URL}/login`;
               }, 2500);

           } catch (error) {
                console.error('Error:', error);
                const statusEl = document.getElementById('status');
                const errorEl = document.getElementById('error');
                statusEl.textContent = 'Error occurred';
                errorEl.style.display = 'block';
                errorEl.innerHTML = `<strong>Error:</strong> ${error.message}<br><br><a href="${GRAFANA_URL}/login" style="color: #d32f2f; text-decoration: underline;">Go to Login</a>`;
           }
       }

        // Start the process
        main();
    </script>
</body>
</html>
