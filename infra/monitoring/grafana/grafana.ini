#################################### Server ##############################
[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
root_url = http://localhost:3009

#################################### Security ##############################
[security]
admin_user = grafana_admin
# Password will be set via environment variable
cookie_secure = false
cookie_samesite = Lax

#################################### Auth ##############################
[auth]
disable_login_form = false
disable_signout_menu = true
allow_signup = false

# Enable anonymous access
[auth.anonymous]
enabled = true
org_role = Admin
hide_sign_out_menu = true

#################################### Session ##############################
[session]
provider = file

#################################### Logging ##############################
[log]
mode = console
level = info

#################################### Database ##############################
[database]
type = sqlite3
path = grafana.db

#################################### Panels ##############################
[panels]
enable_alpha = true

#################################### Plugins ##############################
[plugins]
allow_ui_updates = true
