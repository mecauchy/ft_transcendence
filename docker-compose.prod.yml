# Override file for docker-compose.yml in PRODUCTION environment
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # VAULT SERVICE - PRODUCTION MODE
  vault:
    # Use file-based storage with proper configuration
    command: ["vault", "server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    volumes:
      - vault_data:/vault/file
      - ./infra/vault/vault.hcl:/vault/config/vault.hcl:ro
      - ./infra/secret:/run/secrets:ro
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_LOG_LEVEL: info
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
    # Don't expose ports in production, use ingress/load balancer
    ports: []
    # Simple health check for dev mode
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PostgreSQL SERVICE - PRODUCTION MODE
  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_db_pass.txt
      POSTGRES_INITDB_ARGS: "-c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key"
    volumes:
      - ./infra/secret:/run/secrets:ro
      - postgres_data:/var/lib/postgresql/data
    # Don't expose port directly in production
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root_admin -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis SERVICE - PRODUCTION MODE
  redis:
    command: ["/bin/sh", "-c", "redis-server --appendonly yes --requirepass \"$(cat /run/secrets/redis_password.txt)\""]
    volumes:
      - redis_data:/data
      - ./infra/secret:/run/secrets:ro
    # Don't expose port directly in production
    ports: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # WAF SERVICE - PRODUCTION MODE
  waf:
    environment:
      # Use real TLS certificates in production
      - ENABLE_TLS=true
      - SSL_CERT_PATH=/etc/ssl/certs/server.crt
      - SSL_KEY_PATH=/etc/ssl/private/server.key
    volumes:
      - ./infra/certs:/etc/ssl/certs:ro

  api-gateway:
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - VAULT_ADDRESS=http://vault:8200
      - CORS_ORIGIN=https://192.168.1.57
      - JWT_SECRET_FILE=/run/secrets/jwt_secret.txt
    volumes:
      - ./infra/secret/jwt_secret.txt:/run/secrets/jwt_secret.txt:ro
      - ./infra/secret/vault_token.txt:/run/secrets/vault_token.txt:ro
    command: ["/bin/sh", "-c", "export JWT_SECRET=\"$(cat /run/secrets/jwt_secret.txt)\"; export VAULT_TOKEN=\"$(cat /run/secrets/vault_token.txt)\"; exec node dist/index.js"]

  auth-service:
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - VAULT_ADDR=http://vault:8200
      - JWT_SECRET_FILE=/run/secrets/jwt_secret.txt

  uptime-kuma:
    environment:
      - VAULT_ADDR=http://vault:8200
      

