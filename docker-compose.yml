#docker compose base file

networks:
  public_net:
  dmz_net:
  service_mesh:
  logging_net:

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  uptime-kuma:
  postgres_data:
  redis_data:
  vault_data:

services:
  #WAF SERVICE
  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: waf
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./infra/waf/modsecurity.conf:/etc/nginx/modsecurity.conf:rw
    networks:
      - public_net
      - dmz_net
      - logging_net
    depends_on:
      - vault
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --tries=1 --timeout=1 http://127.0.0.1:8080/ 2>&1 | grep -q '127.0.0.1:8080'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: packages/backend/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    networks:
      - dmz_net
      - service_mesh
      - logging_net
    depends_on:
      - vault
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s


  vault:
    image: hashicorp/vault:1.13.3
    container_name: vault
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_SKIP_VERIFY=true
    networks:
      - service_mesh
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --tries=1 --timeout=2 http://127.0.0.1:8200/v1/sys/health?standbyok=true || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # DATABASE SERVICE
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=root_admin
    volumes:
      - postgres_data:/var/lib/postgres/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - service_mesh
      - logging_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - vault

  # REDIS SERVICE
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - service_mesh
      - logging_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - vault

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - "monitoring"
    restart: no
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - logging_net
    depends_on:
      - alertmanager

  # Alertmanager - Gestion et envoi des alertes vers Discord
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    profiles:
      - "monitoring"
    depends_on:
      - vault
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./infra/monitoring/alertmanager/entrypoint.sh:/entrypoint.sh
      - alertmanager_data:/alertmanager
    entrypoint: /entrypoint.sh
    environment:
      # Webhook Discord stocké dans Vault (secret/data/alertmanager)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root_token_dev_only
    ports:
      - "9093:9093"
    networks:
      - logging_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # On utilise profile en tant que "interupteur" pour eviter qu'il consomme de la memoire pr rien. 
    # Avec cette ligne, grafana ne demarrera que si je tape [docker compose --profile monitoring up] sino  eteint par default
    profiles:
      - "monitoring"
    user: "472"
    depends_on:
      - prometheus
      - vault
    # http://localhost:3000 -> voir les graphiques sur le navigateur
    ports:
      - 3000:3000
    volumes:
      # l1: persisitane, si power off alors comptes utilisateurs et dashboards sauvegardes 
      #l2: script d'automatisation qui evite de configurer garafana a prometheus a la main
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/entrypoint.sh:/entrypoint.sh
    entrypoint: /entrypoint.sh
    environment:
      - GF_SECURITY_ADMIN_USER=grafana_admin
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root_token_dev_only
    networks:
      - logging_net
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    profiles:
      - "monitoring"
    privileged:
      true
    ports:
      - 8081:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - logging_net
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    volumes:
    # persistance des donnees d'uptime kuma
      - uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3001
    networks:
      - logging_net
